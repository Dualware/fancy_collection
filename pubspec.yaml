name: fancy_collection
description: >-
  Observable List and Map implementations for Flutter that notify listeners
  about added, updated and removed entries, including changes in nested
  collections.
version: 0.1.0
repository: https://github.com/Dualware/fancy_collection
issue_tracker: https://github.com/Dualware/fancy_collection/issues
topics:
  - collections
  - observable
  - state-management
  - listener

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
